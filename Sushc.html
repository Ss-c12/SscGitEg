<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小帅哥</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .box { background: #fff9; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px #0001; max-width: 700px; width: 90%; }
        header, nav, footer { text-align: center; }
        nav a { margin: 0 10px; color: #667eea; text-decoration: none; }
        
        main { margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 30px; }
        
        .lucky-panel { display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #eaeaea; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 160px; }
        .lucky-panel h3 { margin: 0 0 15px 0; font-size: 15px; color: #444; }
        .lucky-panel input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; outline: none; cursor: pointer; width: 100%; box-sizing: border-box; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%; }
        .lucky-panel button { padding: 8px 0; border-radius: 6px; border: none; cursor: pointer; transition: 0.3s; font-size: 13px; width: 100%; }
        .btn-save { background: #667eea; color: white; }
        .btn-save:hover { background: #5568c9; }
        /* 版本A特有的样式：全部清除按钮 */
        .btn-clear-all { background: #ff6b6b; color: white; }
        .btn-clear-all:hover { background: #ee5253; }
        
        #lucky-result { margin-top: 15px; font-weight: bold; color: #667eea; font-size: 14px; text-align: center; word-break: break-all; }

        .img-container { display: flex; flex-direction: column; align-items: center; }
        main img { display: block; max-width: 100%; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        main p { margin: 10px 0 0 0; font-size: 15px; }
        
        footer { color: #999; font-size: 14px; border-top: 1px solid #eee; padding-top: 15px; margin-top: 10px; }

        @media (max-width: 600px) {
            main { flex-direction: column-reverse; } 
            .lucky-panel { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div class="box">
        <header><h1>双生</h1></header>
        <nav><a href="#">首页</a><a href="#">关于</a><a href="#">联系</a></nav>
        
        <main>
            <div class="lucky-panel">
                <h3>🔮 选择幸运日</h3>
                <input type="date" id="date-picker">
                <div class="btn-group">
                    <button id="save-btn" class="btn-save">保存</button>
                    <!-- 版本A：添加全部清除按钮 -->
                    
                    <button id="clear-all-btn" class="btn-clear-all">逐个清除</button>

                    <button id="clear-all-btn" class="btn-clear-all">全部清除</button>
                    
                </div>
                <p id="lucky-result">尚未选择</p>
            </div>

            <div class="img-container">
                <img src="D:\君の膵臓を食べたい\1.jpg" alt="君の膵臓を食べたい" width="200">
                <p>君の膵臓を食べたい</p>
                <p>Sscxmx</p>
            </div>
        </main>

        <footer>帅帅的小站</footer>
    </div>

    <script>
        const datePicker = document.getElementById('date-picker');
        const saveBtn = document.getElementById('save-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const luckyResult = document.getElementById('lucky-result');

        function updateUI(dateValue) {
            if (dateValue) {
                datePicker.value = dateValue;
                luckyResult.textContent = `幸运日: ${dateValue}`;
            } else {
                datePicker.value = '';
                luckyResult.textContent = '尚未选择';
            }
        }

        window.onload = function() {
            const savedDate = localStorage.getItem('myLuckyDay');
            if (savedDate) updateUI(savedDate);
        };

        saveBtn.addEventListener('click', () => {
            const selectedDate = datePicker.value;
            if (selectedDate) {
                localStorage.setItem('myLuckyDay', selectedDate);
                updateUI(selectedDate);
            } else {
                alert('请先选择一个日期哦！');
            }
        });

        // 版本A特有逻辑：全部清除
        clearAllBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有幸运日记录吗？')) {
                localStorage.clear(); // 暴力清空
                updateUI(null); 
                alert('已全部清除！');
            }
        });
    </script>
</body>
</html>
