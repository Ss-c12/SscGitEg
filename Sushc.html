<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小帅哥</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .box { background: #fff9; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px #0001; max-width: 650px; width: 90%; }
        header, nav, footer { text-align: center; }
        nav a { margin: 0 10px; color: #667eea; text-decoration: none; }
        
        main { margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 30px; }
        
        .lucky-panel { display: flex; flex-direction: column; align-items: center; background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #eee; min-width: 150px; }
        .lucky-panel h3 { margin: 0 0 15px 0; font-size: 16px; color: #555; }
        .lucky-panel input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; outline: none; cursor: pointer; }
        .lucky-panel button { margin-top: 15px; padding: 8px 20px; border-radius: 5px; border: none; background: #667eea; color: white; cursor: pointer; transition: 0.3s; }
        .lucky-panel button:hover { background: #5568c9; }
        #lucky-result { margin-top: 15px; font-weight: bold; color: #667eea; font-size: 14px; }

        .img-container { display: flex; flex-direction: column; align-items: center; }
        main img { display: block; max-width: 100%; border-radius: 10px; }
        main p { margin: 10px 0 0 0; }
        
        footer { color: #999; font-size: 14px; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <header><h1>双生</h1></header>
        <nav><a href="#">首页</a><a href="#">关于</a><a href="#">联系</a></nav>
        
        <main>
            <div class="lucky-panel">
                <h3>选择幸运日</h3>
                <input type="date" id="date-picker">
                <button id="save-btn">确定选择</button>
                <p id="lucky-result">尚未选择</p>
            </div>

            <div class="img-container">
                <img src="D:\君の膵臓を食べたい\1.jpg" alt="君の膵臓を食べたい" width="200">
                <p>君の膵臓を食べたい</p>
                <p>Sscxmx</p>
            </div>
        </main>

        <footer>美美的小站</footer>
    </div>

    <!-- 第二步：JS 加入 localStorage 保存 -->
    <script>
        const datePicker = document.getElementById('date-picker');
        const saveBtn = document.getElementById('save-btn');
        const luckyResult = document.getElementById('lucky-result');

        // 页面加载时，读取之前保存的日期
        window.onload = function() {
            const savedDate = localStorage.getItem('myLuckyDay');
            if (savedDate) {
                datePicker.value = savedDate; 
                luckyResult.textContent = `幸运日: ${savedDate}`; 
            }
        };

        // 点击保存按钮
        saveBtn.addEventListener('click', () => {
            const selectedDate = datePicker.value;
            if (selectedDate) {
                luckyResult.textContent = `幸运日: ${selectedDate}`;
                // 核心：保存到浏览器的 localStorage 中
                localStorage.setItem('myLuckyDay', selectedDate); 
                alert('幸运日已成功保存！');
            } else {
                alert('请先选择一个日期！');
            }
        });
    </script>
</body>
</html>
